# CalMS21 — self-supervised pretraining by masked keypoint modeling (MKM).
# Encoder used for the "BehaVERT (self-supervision)" row of Table 1.
#
#   behavert pretrain configs/calms21/pretrain.yaml                        # all CalMS21 sessions
#   behavert pretrain configs/calms21/pretrain.yaml --use-all-data false   # Task 1 training sessions only
#
# With use_all_data false, the encoder is pretrained on the Task 1 training sessions
# (labels unused) and then scored on the Task 1 test sessions: reconstruction error of
# the masked coordinates (MSE, RMSE, MAE in pixels) for best_loss/ and last/. The
# settings under task_data_only replace the ones above.
output_dir: outputs/calms21/pretrain
use_all_data: true
task_data_only:
  output_dir: outputs/calms21/pretrain_task1
  data:
    format: calms21
    train: calms21/task1/calms21_task1_train.json
    test: calms21/task1/calms21_task1_test.json

data:
  format: calms21_pretraining
  train: calms21/calms21_all_keypoints.pt     # every CalMS21 session, labels removed
  split: {method: random_windows, valid: 0.2}  # random 20% of the windows for validation
  window: {length: 64, stride: 64}    # non-overlapping 64-frame chunks per session
  augmentation:
    arena: calms21

pretraining:
  mask_ratio: 0.5          # fraction of coordinates set to 0 and reconstructed
  units: px                # unit of the keypoint coordinates, shown with the errors

train:
  epochs: 100
  batch_size: 512
  eval_batch_size: 512
  learning_rate: 5.0e-5
  weight_decay: 1.0e-5
  warmup: 10%
  eval_every: 10           # each evaluation is a full validation pass; raise to train faster
  log_every: 10
  seed: 42
