# CalMS21 Task 1 — attack / investigation / mount per frame, trained from scratch.
# Table 1, "BehaVERT" row.
output_dir: outputs/calms21/task1

data:
  format: calms21
  train: calms21/task1/calms21_task1_train.json
  test: calms21/task1/calms21_task1_test.json
  split: {method: random_windows, valid: 0.2}   # random 20% of the training windows
  window:
    length: 64
    stride: 32                 # 50% overlap (temporal unfolding)
  augmentation:
    arena: calms21
    classes: [0, 1, 2, 3]      # augment windows containing any of these classes (here: all)

model:
  mode: token
  num_classes: 4
  label_names: [attack, investigation, mount, other]

loss:
  name: hybrid
  gamma: 5.0
  alpha: 0.2
  class_weight_multipliers: [6, 1, 1, 1]   # attack, investigation, mount, other; scale the inverse-proportion weights


train:
  epochs: 2000
  batch_size: 512
  eval_batch_size: 512
  learning_rate: 1.0e-5
  weight_decay: 0.01
  warmup: 10%
  eval_every: 10
  log_every: 10
  metric_ignore_classes: [3]   # "other" frames are not scored
  seed: 42
