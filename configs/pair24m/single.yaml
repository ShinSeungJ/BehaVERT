# PAIR-R24M single-animal behavior — 11 classes per frame, token model (Table 7, "+Unfold" row).
# Every animal is its own recording: the single-animal files plus both animals of each
# two-animal file (66 tracks).
# Other Table 7 rows: Base = window stride 64; +Aug = stride 64 and augmentation.enabled true;
# +Unfold +Aug = augmentation.enabled true. Augmentation lowers the scores on this dataset
# (behaviors are tied to arena locations), so the best row has it off.
output_dir: outputs/pair24m/single

data:
  format: pair24m_single
  single: pair24m/single
  multi: pair24m/multi
  # Video-level 60/20/20 split that balances the class mix (behavert.data.recordings.balanced_split).
  split:
    method: fixed
    train:
      - single/20210121_Recording_SR2_SR4m_social_wvid_markerDataset
      - multi/20210129_Recording_SR1_SR4_social_wvid_markerDataset/an2
      - multi/20210201_Recording_SR1_SR5_social_wvid_markerDataset/an1
      - multi/20210201_Recording_SR1_SR5_social_wvid_markerDataset/an2
      - multi/20210201_Recording_SR2_SR4red_social_wvid_markerDataset/an1
      - multi/20210201_Recording_SR2_SR4red_social_wvid_markerDataset/an2
      - multi/20210201_Recording_SR4red_SR5_social_wvid_markerDataset/an1
      - multi/20210201_Recording_SR4red_SR5_social_wvid_markerDataset/an2
      - multi/20210202_Recording_SR2_SR5red_social_wvid_markerDataset/an1
      - multi/20210202_Recording_SR2_SR5red_social_wvid_markerDataset/an2
      - multi/20210202_Recording_SR3_SR4red_social_wvid_markerDataset/an1
      - multi/20210202_Recording_SR3_SR4red_social_wvid_markerDataset/an2
      - multi/20210202_Recording_SR3_SR5red_social_wvid_markerDataset/an1
      - multi/20210202_Recording_SR3_SR5red_social_wvid_markerDataset/an2
      - multi/20210203_Recording_SR1_SR2_social_wvid_markerDataset/an1
      - multi/20210203_Recording_SR1_SR2_social_wvid_markerDataset/an2
      - multi/20210203_Recording_SR1_SR3_social_wvid_markerDataset/an1
      - multi/20210203_Recording_SR1_SR3_social_wvid_markerDataset/an2
      - multi/20210203_Recording_SR1_SR4_social_wvid_markerDataset/an1
      - multi/20210203_Recording_SR1_SR4_social_wvid_markerDataset/an2
      - multi/20210203_Recording_SR1_SR5_social_wvid_markerDataset/an1
      - multi/20210203_Recording_SR1_SR5_social_wvid_markerDataset/an2
      - multi/20210203_Recording_SR2red_SR3_social_wvid_markerDataset/an1
      - multi/20210203_Recording_SR2red_SR3_social_wvid_markerDataset/an2
      - multi/20210203_Recording_SR2red_SR5_social_wvid_markerDataset/an1
      - multi/20210203_Recording_SR2red_SR5_social_wvid_markerDataset/an2
      - multi/20210203_Recording_SR3_SR4red_social_wvid_markerDataset/an1
      - multi/20210203_Recording_SR3_SR4red_social_wvid_markerDataset/an2
      - multi/20210203_Recording_SR3_SR5red_social_wvid_markerDataset/an1
      - multi/20210203_Recording_SR3_SR5red_social_wvid_markerDataset/an2
      - multi/20210203_Recording_SR4_SR5red_social_wvid_markerDataset/an1
      - multi/20210203_Recording_SR4_SR5red_social_wvid_markerDataset/an2
      - multi/20210204_Recording_SR2red_SR4_social_wvid_markerDataset/an1
      - multi/20210204_Recording_SR2red_SR4_social_wvid_markerDataset/an2
      - multi/20210219_Recording_SR9red_SR10_social_wvid_markerDataset/an1
      - multi/20210219_Recording_SR9red_SR10_social_wvid_markerDataset/an2
      - multi/20210223_Recording_SR9_SR10red_social_wvid_markerDataset/an1
      - multi/20210223_Recording_SR9_SR10red_social_wvid_markerDataset/an2
      - single/20210204_Recording_SR3_SR6m_wvid_social_markerDataset
    valid:
      - single/20210122_Recording_SR1_SR4m_social_wvid_markerDataset
      - single/20210126_Recording_SR3_SR4m_social_wvid_markerDataset
      - single/20210202_Recording_SR4_SR6m_social_wvid_markerDataset
      - single/20210202_Recording_SR5_SR6m_social_wvid_markerDataset
      - single/20210205_Recording_SR2_SR6m_wvid_social_new_markerDataset
      - single/20210205_Recording_SR4_SR6m_wvid_social_new_markerDataset
      - single/20210205_Recording_SR5_SR6m_wvid_social_markerDataset
      - single/20210218_Recording_SR10_SR11m_social_wvid_markerDataset
      - single/20210218_Recording_SR9_SR11m_social_wvid_markerDataset
      - single/20210222_Recording_SR10_SR11m_social_wvid_markerDataset
