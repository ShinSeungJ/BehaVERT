# SBeA behavior — per-frame behavior on the first 900 frames of each recording, with our
# annotations (Fig. 3h). Token model.
#
#   behavert train configs/sbea/behavior.yaml --task social
#
# Tasks: social (interaction between the two mice, 96 values per frame) and single
# (individual behavior; each mouse is its own example, 48 values per frame).
output_dir: outputs/sbea/behavior_{task}

data:
  format: sbea_behavior
  keypoints: sbea/keypoints
  behaviors: sbea/behaviors
  window: {length: 64, stride: 32}
  augmentation:
    arena: sbea

model:
  mode: token

loss: {name: hybrid, gamma: 3.0, alpha: 0.2}

train:
  epochs: 1000
  batch_size: 64
  eval_batch_size: 256
  grad_accum: 8
  learning_rate: 1.0e-6
  weight_decay: 1.0e-3
  warmup: 10%
  eval_every: 5
  log_every: 20
  seed: 42

# Splits balance the class mix and spread rare classes over all splits.
tasks:
  social:
    data:
      mode: social
      split:
        method: fixed
        train:
          - rec25-M3M6-20221108
          - rec25-M1M4-20221109
          - rec15-M3M10-20221109
          - rec16-M4M7-20221109
          - rec19-M1M10-20221109
