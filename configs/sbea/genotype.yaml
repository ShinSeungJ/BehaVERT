# SBeA genotype — KO-KO / KO-WT / WT-WT pair from 128-frame windows, [CLS] sequence model
# (Tables 5 and 6). Table 5 = window-level F1, Table 6 = recording-level F1 (each recording
# labelled from its averaged window probabilities).
#
# Other window lengths in the paper:
#   1024 frames: window {length: 1024, stride: 512},
#     model.max_position_embeddings 1025, epochs 50, learning_rate 1e-5,
#     weight_decay 1e-3
#   64 frames: window {length: 64, stride: 32},
#     epochs 50, batch_size 512, grad_accum 1, learning_rate 1e-5,
#     weight_decay 1e-3
output_dir: outputs/sbea/genotype
label_title: genotype              # first column of the validation table

data:
  format: sbea_genotype
  keypoints: sbea/keypoints
  # 10 recordings per class, shuffled per class with train.seed, 6 / 2 / 2 per class
  split: {method: per_class, train: 0.6, valid: 0.2}
  window: {length: 128, stride: 64, pad_remainder: true}
  augmentation:
    arena: sbea

model:
  mode: sequence
  num_classes: 3
  label_names: [KO-KO, KO-WT, WT-WT]
  positional_encoding: learned
  embedding_dropout: 0.1

loss: {name: f1}                # soft macro-F1 loss
sampler: proportional

train:
  epochs: 100
  batch_size: 32
  eval_batch_size: 256
  grad_accum: 16
  learning_rate: 1.0e-6
  weight_decay: 0.01
  warmup: 10%
  eval_every: 5
  log_every: 20
  select_on: macro_f1
  seed: 42
